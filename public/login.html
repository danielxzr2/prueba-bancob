<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso de analistas</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <p class="brand">Selección de Practicantes</p>
        <a href="/">Formulario de postulación</a>
      </div>
    </header>

    <main class="container tiny">
      <h1>Ingreso de analistas</h1>

      <form id="login-form" class="card" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="button primary">Ingresar</button>
        <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="/js/api.js" defer></script>
    <script src="/js/login.js" defer></script>
  </body>
</html>
